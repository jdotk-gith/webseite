
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benutzer-Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      padding: 30px 15px;
      margin: 0;
    }
    .container {
      max-width: 440px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px #0001;
    }
    h1 { text-align: center; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    #abmelden { background: #64748b; }
    #benutzerbereich { display: none; }
    #status {
      margin-top: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Benutzer-Login</h1>

    <div id="loginbereich">
      <input id="email" type="email"
        placeholder="E-Mail-Adresse"
        autocomplete="username">

      <input id="passwort" type="password"
        placeholder="Passwort"
        autocomplete="current-password">

      <button id="anmelden">Anmelden</button>
    </div>

    <div id="benutzerbereich">
      <h2>Willkommen!</h2>
      <p id="benutzername"></p>
      <p id="rolle"></p>
      <button id="abmelden">Abmelden</button>
    </div>

    <p id="status" role="status">
      Firebase wird geladen ...
    </p>
  </div>

  <script type="module">
    const status = document.getElementById("status");
    const loginbereich =
      document.getElementById("loginbereich");
    const benutzerbereich =
      document.getElementById("benutzerbereich");
    const anmelden =
      document.getElementById("anmelden");

    const firebaseConfig = {
      apiKey: "AIzaSyD4jMTeAzdFjt1gQ26e4dIjD9Fq_OX6UiQ",
      authDomain: "jdotk-webseite.firebaseapp.com",
      projectId: "jdotk-webseite",
      storageBucket: "jdotk-webseite.firebasestorage.app",
      messagingSenderId: "1015775184620",
      appId: "1:1015775184620:web:6e8aa8b627eb1d7907c7c9"
    };

    try {
      const [
        firebaseApp,
        firebaseAuth,
        firebaseFirestore
      ] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js"),
        import("https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js")
      ]);

      const app =
        firebaseApp.initializeApp(firebaseConfig);

      const auth = firebaseAuth.getAuth(app);
      const db = firebaseFirestore.getFirestore(app);

      status.textContent = "Firebase bereit. Bitte anmelden.";

      anmelden.onclick = async () => {
        const email =
          document.getElementById("email").value.trim();
        const passwort =
          document.getElementById("passwort").value;

        if (!email || !passwort) {
          status.textContent =
            "Bitte E-Mail und Passwort eingeben.";
          return;
        }

        anmelden.disabled = true;
        status.textContent = "Anmeldung läuft ...";

        try {
          await firebaseAuth.signInWithEmailAndPassword(
            auth, email, passwort
          );
        } catch (fehler) {
          status.textContent =
            "Firebase-Fehler: " +
            (fehler.code || fehler.message);
        } finally {
          anmelden.disabled = false;
        }
      };

      firebaseAuth.onAuthStateChanged(
        auth,
        async (user) => {
          if (!user) {
            loginbereich.style.display = "block";
            benutzerbereich.style.display = "none";
            return;
          }

          status.textContent =
            "Benutzerrolle wird geprüft ...";

          try {
            const referenz =
              firebaseFirestore.doc(
                db, "users", user.uid
              );

            const dokument =
              await firebaseFirestore.getDoc(referenz);

            if (!dokument.exists()) {
              throw new Error(
                "Keine Benutzerrolle vorhanden."
              );
            }

            const rollen = {
              admin: "Administrator",
              editor: "Redakteur",
              viewer: "Besucher"
            };

            const rolle =
              rollen[dokument.data().role];

            if (!rolle) {
              throw new Error(
                "Unbekannte Benutzerrolle."
              );
            }

            document.getElementById(
              "benutzername"
            ).textContent =
              "Angemeldet als: " + user.email;

            document.getElementById(
              "rolle"
            ).textContent =
              "Deine Rolle: " + rolle;

            loginbereich.style.display = "none";
            benutzerbereich.style.display = "block";

            status.textContent =
              "Anmeldung erfolgreich.";
          } catch (fehler) {
            status.textContent =
              "Fehler beim Lesen der Rolle: " +
              fehler.message;

            await firebaseAuth.signOut(auth);
          }
        },
        (fehler) => {
          status.textContent =
            "Authentifizierungsfehler: " +
            (fehler.code || fehler.message);
        }
      );

      document.getElementById(
        "abmelden"
      ).onclick = async () => {
        try {
          await firebaseAuth.signOut(auth);
          status.textContent =
            "Erfolgreich abgemeldet.";
        } catch (fehler) {
          status.textContent =
            "Fehler beim Abmelden: " +
            fehler.message;
        }
      };

    } catch (fehler) {
      status.textContent =
        "Firebase konnte nicht geladen werden: " +
        fehler.message;
    }
  </script>
</body>
</html>
